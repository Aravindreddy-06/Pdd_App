<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appium Test Dashboard</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: system-ui; padding: 30px; text-align: center; }
    .grid { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: #1e293b; padding: 25px; border-radius: 10px; border: 1px solid #334155; min-width: 150px; }
    .val { font-size: 2.2rem; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>📊 Appium Test Execution Dashboard</h1>
  <div class="grid">
    <div class="card"><div>Total Tests</div><div class="val">510</div></div>
    <div class="card"><div>Passed</div><div class="val" style="color:#22c55e">510</div></div>
    <div class="card"><div>Failed</div><div class="val" style="color:#ef4444">0</div></div>
    <div class="card"><div>Pass Percentage</div><div class="val" style="color:#3b82f6">100%</div></div>
  </div>
</body>
</html>
