name: Enterprise Android Appium E2E Automation & GitHub Pages CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Checkout Repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js Environment
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Set up Java JDK 17
      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Install Dependencies
      - name: 📦 Install Project & Appium Dependencies
        run: |
          npm ci
          npm install -g appium@latest
          appium driver install uiautomator2

      # Step 5: Build Application & Android APK
      - name: 🛠️ Build Web App & Android APK
        run: |
          npm run build
          node scripts/build-apk.js

      # Step 6: Start Appium Server in Background
      - name: 🚀 Start Appium Server
        run: |
          appium --log-timestamp --log appium.log &
          sleep 5

      # Step 7: Enable KVM Hardware Acceleration for Android Emulator
      - name: ⚡ Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      # Step 8: Run Android Emulator & Execute Appium Test Suite
      - name: 📱 Run Android Emulator & Appium E2E Suite
        uses: ReactiveCircuits/android-runner@v1
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: npm run test:appium

      # Step 9: Upload Test Artifacts (Reports, Screenshots, Logs)
      - name: 📤 Upload E2E Test Reports & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            appium-tests/reports/index.html
            appium-tests/reports/appium_e2e_test_report.xlsx
            appium-tests/reports/screenshots/
            appium-tests/reports/logs/
            appium.log

  # Job 2: Deploy Reports to GitHub Pages
  deploy-reports:
    needs: build-and-test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Test Reports Artifact
        uses: actions/download-artifact@v4
        with:
          name: appium-test-reports
          path: public-reports

      - name: 🚀 Deploy Test Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          destination_dir: ./
