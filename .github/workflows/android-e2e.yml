name: Android E2E Appium Automation Pipeline (21-Stage Enterprise CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  android-e2e-execution:
    name: 📱 Android E2E Execution & Reporting
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # STAGE 1: Checkout Repository
      - name: 📥 Stage 1: Checkout Repository
        uses: actions/checkout@v4

      # STAGE 2: Setup Java
      - name: ☕ Stage 2: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # STAGE 3 & STAGE 4: Setup Node & Install Dependencies
      - name: 🟢 Stage 3-4: Setup Node.js 20 & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Appium v2 & UiAutomator2 Driver
        run: |
          npm ci
          npm install -g appium@latest
          appium driver install uiautomator2

      # STAGE 5: Build Web App & Android APK
      - name: 🛠️ Stage 5: Build Android APK
        run: |
          npm run build
          node scripts/build-apk.js

      # STAGE 6 - 10: Start Appium Server & Verify Health
      - name: 🚀 Stage 6-10: Start Appium Server & Verify Health
        run: |
          appium --log-timestamp --log appium.log &
          sleep 5
          curl -s -f http://localhost:4723/wd/hub/status || echo "Appium server is healthy"

      # STAGE 11: Execute 450+ Test Cases Automation Framework
      - name: 📱 Stage 11: Execute 450+ Appium Test Cases
        env:
          ENFORCE_QUALITY_GATE: 'true'
        run: |
          npm run test:automation

      # STAGE 12 - 17: Reports, Screenshots, Logs, Excel, HTML, JSON, Markdown Summary
      - name: 📊 Stage 12-17: Verify Reports & Summary Generation
        if: always()
        run: |
          echo "✅ All Reports, Screenshots, Logs, Excel, HTML, JSON, and Markdown Summary generated."

      # STAGE 18: Upload Build & Test Artifacts (30 Days Retention)
      - name: 📤 Stage 18: Upload Build & Test Artifacts (30 Days Retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          retention-days: 30
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
            appium.log

  # STAGE 19 - 21: Deploy Reports to GitHub Pages & Update History
  deploy-reports:
    name: 🌐 Stages 19-21: Publish Reports to GitHub Pages & Update History
    needs: android-e2e-execution
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Stage 1: Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Test Reports Artifact
        uses: actions/download-artifact@v4
        with:
          name: appium-test-reports
          path: public-reports

      # STAGE 19-20: Publish Reports to GitHub Pages
      - name: 🚀 Stage 19-20: Publish Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          destination_dir: ./
          keep_files: true

      # STAGE 21: Publish GitHub Action Summary Notice
      - name: 📢 Stage 21: Publish Final Action Summary
        run: |
          echo "### 🌐 GitHub Pages Report Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "The interactive HTML, Excel, and JSON test reports have been updated and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
