name: Deploy E2E Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Android E2E Appium Automation Pipeline (21-Stage Enterprise CI/CD)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-github-pages:
    name: '🌐 Stages 19-21: Publish Reports to GitHub Pages & Update History'
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4

      - name: '📥 Download Test Reports Artifact'
        uses: actions/download-artifact@v4
        with:
          name: appium-test-reports
          path: public-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: '🚀 Stage 19-20: Publish Reports to GitHub Pages'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          destination_dir: ./
          keep_files: true

      - name: '📢 Stage 21: Publish Final Deployment Summary Notice'
        run: |
          echo "### 🌐 GitHub Pages Report Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "The interactive HTML, Excel, and JSON test reports have been updated and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
