name: Deploy E2E Reports to GitHub Pages (Stages 19-21)

on:
  workflow_run:
    workflows: ["Android E2E Appium Automation Pipeline (21-Stage Enterprise CI/CD)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-github-pages:
    name: 🌐 Stages 19-21: Publish Reports to GitHub Pages & Update History
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Download Test Reports Artifact
        uses: actions/download-artifact@v4
        with:
          name: appium-test-reports
          path: public-reports

      # STAGE 19-20: Publish Reports to GitHub Pages
      - name: 🚀 Stage 19-20: Publish Reports to GitHub Pages & Update Execution History
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public-reports
          destination_dir: ./
          keep_files: true

      # STAGE 21: Publish GitHub Action Summary Notice
      - name: 📢 Stage 21: Publish Final Deployment Summary Notice
        run: |
          echo "### 🌐 GitHub Pages Report Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "The interactive HTML, Excel, and JSON test reports have been updated and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
